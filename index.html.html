<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дело №13 «Пропавший звонок» — терминал следствия</title>
<style>
  :root {
    --bg: #0e0c09;
    --bg2: #171310;
    --paper: #d8c49a;
    --paper-dim: #a8936f;
    --ink: #e8dcc0;
    --accent: #d4a017;
    --accent2: #8b5a2b;
    --red: #b33a3a;
    --green: #6a8f5a;
    --border: #3a2f22;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 0%, rgba(212,160,23,0.06), transparent 60%);
    color: var(--ink);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    padding: 16px;
  }

  .terminal {
    max-width: 820px;
    margin: 0 auto;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
  }

  .header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: linear-gradient(180deg, #1d1812, #171310);
  }

  .case-id {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Courier New', monospace;
  }

  .team-name {
    font-size: 13px;
    color: var(--paper);
    font-family: 'Courier New', monospace;
    border-bottom: 1px dashed var(--accent2);
    max-width: 260px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .clock {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--paper-dim);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 3px;
  }

  .bank-btn {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--accent2);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  .bank-btn:hover { background: rgba(212,160,23,0.12); }

  .tabs {
    display: flex;
    gap: 2px;
    background: #100d0a;
    padding: 10px 20px 0;
  }

  .tab {
    flex: 1;
    padding: 12px;
    background: #221b13;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    color: var(--paper-dim);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab.active {
    background: var(--bg2);
    color: var(--accent);
    border-color: var(--accent2);
  }

  .screen {
    padding: 26px 28px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-top: 1px solid var(--border);
  }

  .scene-title {
    font-size: 21px;
    color: var(--accent);
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
  }

  .scene-text {
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-line;
  }

  .name-input {
    width: 100%;
    background: rgba(212,160,23,0.04);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 18px;
    padding: 12px 16px;
    border-radius: 4px;
    outline: none;
    text-align: center;
  }

  .name-input:focus { border-color: var(--accent); }

  .main-btn {
    display: block;
    margin: 14px auto 0;
    padding: 14px 40px;
    background: var(--red);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .main-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .main-btn.green { background: var(--green); color: #10140e; }
  .main-btn.green:hover { background: #7ba567; }

  .code-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: stretch;
    margin-top: 8px;
  }

  .code-input {
    width: 160px;
    padding: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 22px;
    text-align: center;
    outline: none;
  }

  .code-input:focus { border-color: var(--accent); }

  .code-btn {
    padding: 12px 24px;
    background: var(--red);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
  }

  .feedback-ok {
    border-left: 3px solid var(--green);
    background: rgba(106,143,90,0.08);
    padding: 12px 16px;
    color: #b8ccaa;
    font-size: 15px;
    margin-top: 10px;
  }

  .feedback-bad {
    border-left: 3px solid var(--red);
    background: rgba(179,58,58,0.08);
    padding: 12px 16px;
    color: #d9a0a0;
    font-size: 15px;
    margin-top: 10px;
  }

  .q-num {
    text-align: center;
    font-size: 14px;
    color: var(--paper-dim);
    font-family: 'Courier New', monospace;
  }

  .q-text {
    text-align: center;
    font-size: 19px;
    color: var(--paper);
    line-height: 1.5;
  }

  .opts {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper);
    padding: 12px 16px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s ease;
  }

  .opt:hover { border-color: var(--accent); color: var(--accent); }
  .opt.selected { border-color: var(--accent); color: var(--accent); background: rgba(212,160,23,0.08); }
  .opt.esc { border-style: dashed; color: var(--paper-dim); }

    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1.5px solid var(--paper-dim);
    flex-shrink: 0;

    border-radius: 6px;
    padding: 14px 18px;
    background: rgba(139,90,43,0.08);
    font-size: 15px;
    line-height: 1.6;
    color: var(--paper);
  }

  .evidence-list {
    border: 1px dashed var(--accent2);
    border-radius: 6px;
    padding: 14px 18px;
    background: rgba(139,90,43,0.06);
    font-size: 14px;
    line-height: 1.7;
    color: var(--paper);
  }

  .evidence-list b { color: var(--accent); }

  .hint-overlay,
  .bank-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,6,4,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }

  .hint-panel {
    max-width: 560px;
    width: 100%;
    background: #e8dcc4;
    color: #2a221a;
    border-radius: 8px;
    padding: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    max-height: 82vh;
    overflow-y: auto;
    position: relative;
  }

  .hint-panel .x {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 22px;
    color: #6a5a44;
    cursor: pointer;
    border: none;
    background: none;
    font-family: inherit;
  }

  .hint-panel .h-doc { text-align: center; font-size: 17px; font-weight: bold; margin-bottom: 18px; }
  .hint-panel .h-text { font-size: 16px; line-height: 1.6; margin-bottom: 10px; }

    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    background: var(--red);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;

  .bank-panel {
    max-width: 640px;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    background: var(--bg2);
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 24px;
  }

  .bank-panel h3 {
    color: var(--accent);
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }

  .bank-item {
    border-left: 3px solid var(--accent);
    background: rgba(212,160,23,0.05);
    padding: 10px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--paper);

  .bank-item .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Courier New', monospace;
    color: var(--paper-dim);
    margin-bottom: 3px;
  }

  .bank-close {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper);
    font-family: inherit;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  .progress-line {
    text-align: center;
    font-size: 13px;
    color: var(--paper-dim);
    font-family: 'Courier New', monospace;
  }

  .clue-box {
    background: rgba(212,160,23,0.06);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    font-size: 14px;
    color: var(--paper);
    font-style: italic;
  }

  .clue-box::before {
    content: 'УЛИКА В ПАПКУ: ';
    font-style: normal;
    font-weight: bold;
    color: var(--accent);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .envelope {
    background: rgba(179,58,58,0.08);
    border: 1px solid var(--red);
    border-radius: 6px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--paper);
  }

  .final-win {
    border: 2px solid var(--green);
    padding: 22px;
    border-radius: 6px;
    background: rgba(106,143,90,0.08);
  }

  .choices { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }

  .btn {
    text-align: left;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--paper);
    padding: 13px 18px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.25s ease;
  }

  .btn:hover { background: rgba(212,160,23,0.1); border-color: var(--accent); color: var(--accent); }
  .btn.special { border-color: var(--accent2); color: var(--accent); }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.7s ease; }

  @media (max-width: 600px) {
    .screen { padding: 18px 14px; }
    .scene-title { font-size: 18px; }
  }
</style>
</head>

<script>

  // ВЕРСИИ ГРУПП: маршрут 1 — организатор; маршрут 2 — химик; маршрут 3 — физик.

  var ROUTES = {

    { id: 'letter', name: 'Приветственное письмо', cat: 'Штаб',
      text: 'Дорогие следователи! Сегодня, 24 мая 1988 года, накануне Последнего звонка и пятидесятилетия школы, из лаборатории кабинета химии исчез бронзовый звонок — дар выпускников 1968 года, главная реликвия праздника. К утру линейка, без звонка — никак.\n\nВашей группе выделены свои кабинеты — они указаны в вашей карточке маршрута. Двери остальных кабинетов опечатаны: следствие не разрешает группам мешать друг другу. Улики спрятаны в ваших кабинетах, на каждой — стикер с номером. Совещание всех групп — в кабинете директора.\n\nP.S. Тревожное обстоятельство: педагог-организатор Наталья Викторовна с восьми часов вечера не выходила на связь. Учитывайте это.' },
    { id: 'dosie', name: 'Досье подозреваемых (13 карточек)', cat: 'Штаб',

  // ==================== ВЫЕЗДНЫЕ ПРЕДМЕТЫ 1–33 ====================
  var ITEMS = {

      ok: 'Витя Лапин. Мотив (вырезанная реплика), возможность (напросился к опыту, звонок на руках в 18:30), знание (брошюра про сундук), улики (черновик и записка в кармане халата). Всё сходится.' },
    { q: 'ШАГ 3. Где звонок?',
      evidence: [
        'Традиция хранения до 1968 года: сундук с реквизитом (№17).',
        'Место сундука: за левой кулисой (№24).',
        'След в пыли: кольцо от основания звонка (№25).',
        'Ключ от кладовой висел у самой двери (№16).'
      ],
      opts: ['В сейфе директора', 'В лабораторном шкафу', 'В сундуке с реквизитом — традиционном хранилище реликвии', 'Унесён домой'], a: 2,
      ok: 'Сундук. Тот самый, из брошюры 1968 года. Ключ висел у самой двери кладовой.' }
  ];

  var ENVELOPE_TEXT = 'Показания Тани Крыловой, старосты 11-А: «Повторный опыт я провела с помощником. Официально его не назначали — Витя Лапин напросился сам, и Олег Борисович дал ему халат уже после того, как Витя оказался в лаборатории. В 18:40 меня забрали на прогон — отнести звонок директору вызвался Витя, он сказал: „Отнесу сам“. Больше я его не видела. А Наталья Викторовна? Она перед прогоном уехала за спиртом — сказал Олег Борисович: без него контрольный опыт никак».';

  // ==================== СОХРАНЕНИЕ ====================
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) { /* нет доступа к хранилищу */ }
  }

  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var saved = JSON.parse(raw);
      if (saved && saved.teamName) {
        state.teamName = saved.teamName || '';
        state.route = saved.route || '';
        state.found = saved.found || [];
        state.solved = saved.solved || [];
        state.qView = (saved.qView === undefined) ? null : saved.qView;
        state.localVersionDone = !!saved.localVersionDone;
        state.meetingDone = !!saved.meetingDone;
        state.finalStep = saved.finalStep || 0;
        state.envelopeOpen = !!saved.envelopeOpen;
        state.hintsUsed = saved.hintsUsed || {};
        state.clock = saved.clock || (19 * 60 + 40);
        state.tab = saved.tab || 'field';
        return true;
      }
    } catch (e) { /* повреждённое хранилище — начнём заново */ }
    return false;
  }

  // ==================== ХЕЛПЕРЫ ====================
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function clearScreen() {
    screenEl.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function isFound(id) { return state.found.indexOf(id) !== -1; }

  function reqSatisfied(req) {
    if (Array.isArray(req)) return req.every(isFound);
    return isFound(req);
  }

  function tickClock(min) {
    state.clock += min;
    var h = Math.floor(state.clock / 60), m = state.clock % 60;
    clockEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    save();
  }

  function updateBankBtn() {
    var total = ROUTE_TOTALS[state.route] || 10;
    bankBtn.textContent = '📁 Папка (' + state.found.length + '/' + total + ')';
  }

  function unlockedQuestions() {
    var qs = QUESTIONS[state.route];
    var res = [];
    for (var i = 0; i < qs.length; i++) {
      if (state.solved.indexOf(i) === -1 && reqSatisfied(qs[i].required)) res.push(i);
    }
    return res;
  }

  function allSolved() {
    return state.solved.length === QUESTIONS[state.route].length;
  }

  // ==================== СТАРТ ====================
  function renderStart() {
    clearScreen();
    tabsEl.style.display = 'none';
    bankBtn.style.display = 'none';

    screenEl.appendChild(el('div', 'scene-title fade-in', 'Штаб следствия. Дело №13.'));
    screenEl.appendChild(el('div', 'scene-text fade-in',
      '24 мая 1988 года, вечер. Бронзовый звонок — реликвия выпускников 1968 года — исчез из лаборатории накануне Последнего звонка.\n\n' +
      'В штабе вас ждёт стартовый пакет: приветственное письмо, досье подозреваемых и карта школы. Каждая группа работает в своих кабинетах — чужие зоны опечатаны. Улики ищите сами, найдёте — вводите номер.'));

    var box = el('div', 'fade-in');

    var lbl = el('label', '', 'Название следственной группы');
    lbl.style.cssText = 'display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px;';
    box.appendChild(lbl);

    var input = el('input', 'name-input');
    input.type = 'text';
    input.maxLength = 30;
    input.placeholder = 'Придумайте название сами';
    input.id = 'teamInput';
    box.appendChild(input);

    var lbl2 = el('label', '', 'Цифра маршрута: 1, 2 или 3');
    lbl2.style.cssText = 'display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--paper-dim);margin:16px 0 8px;';
    box.appendChild(lbl2);

    var rInput = el('input', 'name-input');
    rInput.type = 'text';
    rInput.maxLength = 1;
    rInput.inputMode = 'numeric';
    rInput.placeholder = '1 / 2 / 3';
    rInput.id = 'routeInput';
    box.appendChild(rInput);

    var routeHint = el('div', 'scene-text');
    routeHint.style.fontSize = '13px';
    routeHint.style.color = 'var(--paper-dim)';
    routeHint.textContent = 'Маршрут 1 — буфет, проходная, подсобка уборщицы, кабинет директора. Маршрут 2 — кабинет химии, учительская, архив. Маршрут 3 — библиотека, кабинет физики, актовый зал, кладовая. Зоны не пересекаются: чужие кабинеты опечатаны.';
    box.appendChild(routeHint);

    var warn = el('div', 'feedback-bad');
    warn.style.display = 'none';
    box.appendChild(warn);

    var btn = el('button', 'main-btn', 'Начать расследование');
    btn.addEventListener('click', function () {
      var name = input.value.trim();
      var r = rInput.value.trim();

      if (!name) {
        warn.textContent = 'Сначала впишите название группы.';
        warn.style.display = 'block';
        input.classList.add('shake');
        setTimeout(function () { input.classList.remove('shake'); }, 450);
        return;
      }
      if (!ROUTES[r]) {
        warn.textContent = 'Введите цифру маршрута: 1, 2 или 3.';
        warn.style.display = 'block';
        rInput.classList.add('shake');
        setTimeout(function () { rInput.classList.remove('shake'); }, 450);
        return;
      }

      warn.style.display = 'none';
      state.teamName = name;
      state.route = r;
      teamEl.textContent = name + ' · Маршрут ' + r;
      tabsEl.style.display = 'flex';
      bankBtn.style.display = 'inline-block';
      updateBankBtn();
      state.tab = 'field';
      setActiveTab(tabField);
      save();
      render();
    });

    box.appendChild(btn);
    screenEl.appendChild(box);
  }

  // ==================== ВКЛАДКА «ПОЛЕ И КОДЫ» ====================
  function renderField() {
    clearScreen();

    screenEl.appendChild(el('div', 'scene-title fade-in', 'Поле. Ввод найденных улик'));

    var r = ROUTES[state.route];
    if (r) {
      screenEl.appendChild(el('div', 'route-card fade-in',
        '<b>Ваши зоны: ' + escapeHtml(r.zones) + '</b>.<br>' +
        'Порядок обхода: ' + escapeHtml(r.order) + '.<br>' +
        '<span style="color:var(--paper-dim);font-size:13px;">Чужие кабинеты опечатаны — заходить в них запрещено. Списков здесь не будет: ищите по своим кабинетам сами.</span>'));
    }

    screenEl.appendChild(el('div', 'scene-text fade-in',
      'Осматривайте свои кабинеты: журнал на кафедре, бумаги на столах, ключ у двери. Найдите предмет со стикером — посмотрите номер — введите его здесь.\n\n' +
      'Найдено: ' + state.found.length + ' из ' + ROUTE_TOTALS[state.route] + '.'));

    var codeBox = el('div', 'fade-in');
    codeBox.style.marginTop = '10px';
    codeBox.appendChild(el('div', 'progress-line', 'Введите номер найденного предмета:'));

    var group = el('div', 'code-group');
    var input = el('input', 'code-input');
    input.type = 'text';
    input.id = 'codeInput';
    input.inputMode = 'numeric';
    input.maxLength = 2;
    input.placeholder = '__';
    group.appendChild(input);

    var btn = el('button', 'code-btn', 'Проверить');
    btn.addEventListener('click', function () { checkCode(); });
    group.appendChild(btn);

    codeBox.appendChild(group);

    var fb = el('div', '');
    fb.id = 'codeFeedback';
    codeBox.appendChild(fb);

    screenEl.appendChild(codeBox);

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') checkCode();
    });
  }

  function checkCode() {
    var input = document.getElementById('codeInput');
    var fb = document.getElementById('codeFeedback');
    if (!input || !fb) return;

    var val = input.value.trim();
    fb.innerHTML = '';

    if (!ITEMS[val]) {
      fb.innerHTML = '<div class="feedback-bad">Такого номера нет в деле. Номера — от 1 до ' + TOTAL_ITEMS + '. Проверьте стикер на предмете.</div>';
      input.classList.add('shake');
      setTimeout(function () { input.classList.remove('shake'); }, 450);
      return;
    }

    if (ITEMS[val].route !== state.route) {
      fb.innerHTML = '<div class="feedback-bad">Предмет №' + val + ' — из чужой зоны. Вашей группе он не засчитывается. Вернитесь в свои кабинеты.</div>';
      input.classList.add('shake');
      setTimeout(function () { input.classList.remove('shake'); }, 450);
      return;
    }

    if (isFound(val)) {
      fb.innerHTML = '<div class="feedback-ok">Предмет №' + val + ' («' + ITEMS[val].name + '») уже в папке дела.</div>';
      return;
    }

    state.found.push(val);
    updateBankBtn();
    save();

    var newQ = unlockedQuestions().length > 0;
    fb.innerHTML = '<div class="feedback-ok">Принято! Предмет №' + val + ' — «' + ITEMS[val].name + '». Улика добавлена в папку.' +
      (newQ ? ' На вкладке «Проверить версию» открыт вопрос.' : '') + '</div>';

    input.value = '';
  }

  // ==================== ВКЛАДКА «ПРОВЕРИТЬ ВЕРСИЮ» ====================
  function renderQuestions() {
    clearScreen();

    // 1. Вопросы
    if (!allSolved()) {
      var qs = QUESTIONS[state.route];
      var unlocked = unlockedQuestions();

      if (unlocked.length === 0) {
        screenEl.appendChild(el('div', 'scene-title fade-in', 'Вопросы заблокированы'));
        screenEl.appendChild(el('div', 'scene-text fade-in',
          'Чтобы открыть следующий вопрос, нужно найти улику в своих кабинетах.\n\nВозвращайтесь в зону и продолжайте поиски.'));
        return;
      }

      // Если выбран вопрос — показываем его
      if (state.qView !== null && state.solved.indexOf(state.qView) === -1 && reqSatisfied(qs[state.qView].required)) {
        renderSingleQuestion(state.qView);
        return;
      }

      // Иначе — список доступных вопросов
      screenEl.appendChild(el('div', 'scene-title fade-in', 'Доступные вопросы (' + unlocked.length + ')'));
      screenEl.appendChild(el('div', 'scene-text fade-in',
        'Решено: ' + state.solved.length + ' из ' + qs.length + '. Выберите вопрос — разберём его.'));
      var list = el('div', 'opts fade-in');
      unlocked.forEach(function (idx) {
        var b = el('button', 'opt',
          '<span class="radio"></span><span><b>Вопрос ' + (idx + 1) + '</b><br>' + escapeHtml(qs[idx].q) + '</span>');
        b.addEventListener('click', function () {
          state.qView = idx;
          save();
          renderQuestions();
        });
        list.appendChild(b);
      });
      screenEl.appendChild(list);
      return;
    }

    // 2. Локальный финал: назвать своего подозреваемого
    if (!state.localVersionDone) {
      renderLocalFinal();
      return;
    }

    // 3. Общее совещание
    if (!state.meetingDone) {
      renderMeeting();
      return;
    }

    // 4. Шаги общего финала
    if (state.finalStep >= FINAL_STEPS.length) { renderWin(); return; }
    renderFinalStep();
  }

  function renderSingleQuestion(qi) {
    clearScreen();
    var qs = QUESTIONS[state.route];
    var q = qs[qi];

    screenEl.appendChild(el('div', 'q-num fade-in',
      'Вопрос ' + (qi + 1) + ' из ' + qs.length + ' · решено ' + state.solved.length));
    screenEl.appendChild(el('div', 'q-text fade-in', escapeHtml(q.q)));

    var opts = el('div', 'opts fade-in');
    var selected = -1;

    q.opts.forEach(function (text, oi) {
      var b = el('button', 'opt', '<span class="radio"></span>' + escapeHtml(text));
      b.addEventListener('click', function () {
        var all = opts.querySelectorAll('.opt');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('selected');
        b.classList.add('selected');
        selected = oi;
        checkBtn.disabled = false;
      });
      opts.appendChild(b);
    });

    var esc = el('button', 'opt esc', '<span class="radio"></span>Без понятия. Помогите!');
    esc.addEventListener('click', function () {
      var reqIds = Array.isArray(q.required) ? q.required : [q.required];
      showHintModal(reqIds[0]);
    });
    opts.appendChild(esc);

    screenEl.appendChild(opts);

    var checkBtn = el('button', 'main-btn', 'Проверить версию');
    checkBtn.disabled = true;
    checkBtn.addEventListener('click', function () {
      if (selected === -1) return;
      tickClock(3);
      if (selected === q.a) {
        state.solved.push(qi);
        state.qView = null;
        save();
        renderCorrect(q);
      } else {
        var all = opts.querySelectorAll('.opt');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('selected');
        selected = -1;
        checkBtn.disabled = true;
        opts.classList.add('shake');
        setTimeout(function () { opts.classList.remove('shake'); }, 450);

        var reqIds = Array.isArray(q.required) ? q.required : [q.required];
        var names = reqIds.map(function (id) { return '№' + id + ' «' + ITEMS[id].name + '»'; }).join(', ');
        var fb = el('div', 'feedback-bad fade-in',
          'Версия не подтвердилась. Перечитайте в папке: ' + names + ' — или возьмите подсказку.');
        screenEl.insertBefore(fb, checkBtn);
      }
    });
    screenEl.appendChild(checkBtn);

    var back = el('button', 'btn', '← К списку вопросов');
    back.addEventListener('click', function () {
      state.qView = null;
      save();
      renderQuestions();
    });
    screenEl.appendChild(back);
  }

  function renderCorrect(q) {
    clearScreen();
    screenEl.appendChild(el('div', 'scene-title fade-in', 'Версия подтверждена'));
    screenEl.appendChild(el('div', 'feedback-ok fade-in', escapeHtml(q.ok)));

    var reqIds = Array.isArray(q.required) ? q.required : [q.required];
    reqIds.forEach(function (id) {
      if (ITEMS[id]) {
        screenEl.appendChild(el('div', 'clue-box fade-in', ITEMS[id].name + ': ' + ITEMS[id].text));
      }
    });

    var qs = QUESTIONS[state.route];
    var hasNext = state.solved.length < qs.length;
    var next = el('button', 'main-btn' + (hasNext ? '' : ' green'),
      hasNext ? 'К списку вопросов' : 'К финальной проверке версии');
    next.addEventListener('click', function () {
      state.tab = 'q';
      setActiveTab(tabQ);
      render();
    });
    screenEl.appendChild(next);
  }

  // ==================== ЛОКАЛЬНЫЙ ФИНАЛ ====================
  function renderLocalFinal() {
    clearScreen();
    var lf = LOCAL_FINALS[state.route];

    screenEl.appendChild(el('div', 'scene-title fade-in', 'Локальный финал. Версия вашей группы'));
    screenEl.appendChild(el('div', 'scene-text fade-in',
      'Все вопросы вашей зоны закрыты. Пришло время назвать то, во что вы поверили.\n\n' + escapeHtml(lf.q)));

    var opts = el('div', 'opts fade-in');
    var selected = -1;

    lf.opts.forEach(function (text, oi) {
      var b = el('button', 'opt', '<span class="radio"></span>' + escapeHtml(text));
      b.addEventListener('click', function () {
        var all = opts.querySelectorAll('.opt');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('selected');
        b.classList.add('selected');
        selected = oi;
        btn.disabled = false;
      });
      opts.appendChild(b);
    });
    screenEl.appendChild(opts);

    var btn = el('button', 'main-btn', 'Назвать подозреваемого');
    btn.disabled = true;
    btn.addEventListener('click', function () {
      if (selected === -1) return;
      if (selected === lf.a) {
        state.localVersionDone = true;
        save();
        clearScreen();
        screenEl.appendChild(el('div', 'scene-title fade-in', 'Версия зафиксирована'));
        screenEl.appendChild(el('div', 'feedback-ok fade-in', escapeHtml(lf.ok)));
        var next = el('button', 'main-btn green', 'На общее совещание');
        next.addEventListener('click', function () {
          state.tab = 'q';
          setActiveTab(tabQ);
          render();
        });
        screenEl.appendChild(next);
      } else {
        opts.classList.add('shake');
        setTimeout(function () { opts.classList.remove('shake'); }, 450);
        var fb = el('div', 'feedback-bad fade-in',
          'Эта версия не держится на ваших же уликах. Перечитайте папку — и назовите того, на кого указывают улики.');
        screenEl.insertBefore(fb, btn);
      }
    });
    screenEl.appendChild(btn);
  }

  // ==================== ОБЩЕЕ СОВЕЩАНИЕ ====================
  function renderMeeting() {
    clearScreen();
    screenEl.appendChild(el('div', 'scene-title fade-in', 'Кабинет директора. Общее совещание.'));
    screenEl.appendChild(el('div', 'scene-text fade-in', escapeHtml(MEETING_SCENE)));

    var next = el('button', 'main-btn green', 'Продолжить следствие');
    next.addEventListener('click', function () {
      state.meetingDone = true;
      save();
      state.tab = 'q';
      setActiveTab(tabQ);
      render();
    });
    screenEl.appendChild(next);
  }

  // ==================== ШАГИ ОБЩЕГО ФИНАЛА ====================
  function renderFinalStep() {
    clearScreen();
    var step = FINAL_STEPS[state.finalStep];

    if (step.reveal) {
      screenEl.appendChild(el('div', 'scene-title fade-in', 'Совещание. Вскрытие конверта.'));
      screenEl.appendChild(el('div', 'scene-text fade-in',
        'Директор Аркадий Семёнович снимает со стола конверт, запечатанный сургучом. «Это показания старосты. Она написала их утром — до того, как мы поняли, что звонка нет. Таня, я вскрою его при всех».'));

      screenEl.appendChild(el('div', 'envelope fade-in',
        '<b>Конверт вскрыт.</b><br><br>' + escapeHtml(ENVELOPE_TEXT)));

      state.envelopeOpen = true;
      save();

      var next = el('button', 'main-btn green', 'Продолжить следствие');
      next.addEventListener('click', function () {
        state.finalStep++;
        save();
        state.tab = 'q';
        setActiveTab(tabQ);
        render();
      });
      screenEl.appendChild(next);
      return;
    }

    screenEl.appendChild(el('div', 'scene-title fade-in',
      'Финальная проверка версии. Шаг ' + (state.finalStep + 1) + ' из ' + FINAL_STEPS.length));
    screenEl.appendChild(el('div', 'scene-text fade-in',
      'Директор Аркадий Семёнович ждёт. «Проверим вашу версию — шаг за шагом».'));

    // ЧЕК-ЛИСТ УЛИК: игроки видят, на какие доказательства опираться
    if (step.evidence) {
      var evHtml = '<b>Собранные доказательства указывают на:</b><br>';
      step.evidence.forEach(function (line) {
        evHtml += '• ' + escapeHtml(line) + '<br>';
      });
      evHtml += '<br>Кто (или что) подходит под все пункты?';
      screenEl.appendChild(el('div', 'evidence-list fade-in', evHtml));
    }

    var opts = el('div', 'opts fade-in');
    var selected = -1;

    step.opts.forEach(function (text, oi) {
      var b = el('button', 'opt', '<span class="radio"></span>' + escapeHtml(text));
      b.addEventListener('click', function () {
        var all = opts.querySelectorAll('.opt');
        for (var k = 0; k < all.length; k++) all[k].classList.remove('selected');
        b.classList.add('selected');
        selected = oi;
        btn.disabled = false;
      });
      opts.appendChild(b);
    });
    screenEl.appendChild(opts);

    var btn = el('button', 'main-btn', 'Проверить версию');
    btn.disabled = true;
    btn.addEventListener('click', function () {
      if (selected === step.a) {
        state.finalStep++;
        save();
        clearScreen();
        screenEl.appendChild(el('div', 'feedback-ok fade-in', escapeHtml(step.ok)));
        var next = el('button', 'main-btn',
          state.finalStep >= FINAL_STEPS.length ? 'Назвать версию' : 'Следующий шаг');
        next.addEventListener('click', function () {
          state.tab = 'q';
          setActiveTab(tabQ);
          render();
        });
        screenEl.appendChild(next);
      } else {
        opts.classList.add('shake');
        setTimeout(function () { opts.classList.remove('shake'); }, 450);
        var fb = el('div', 'feedback-bad fade-in',
          'Версия разваливается под первым же вопросом. Откройте папку улик — кнопка «📁 Папка» в шапке.');
        screenEl.insertBefore(fb, btn);
      }
    });
    screenEl.appendChild(btn);
  }

  function renderWin() {
    clearScreen();
    screenEl.appendChild(el('div', 'scene-title fade-in', 'Развязка.'));
    screenEl.appendChild(el('div', 'scene-text fade-in',
      'Все шаги приняты. Три версии сгорели — и открыли истину.\n\nВитя входит в кабинет сам, сжимая сценарий. И говорит тихо, но так, что слышат все:'));

    screenEl.appendChild(el('div', 'clue-box fade-in',
      '«Я три недели готовил одну строчку. Одну строчку! А потом её вычеркнули — и даже не объяснили зачем. Завуч Ирина Сергеевна сказала: регламент. Я напросился Тане помогать с опытом — думал, если буду полезен, реплику вернут. Надел халат, чтобы свитер не запачкать, — и не вернул, стыдно было. А когда она ушла на прогон, я взял звонок и отнёс его в сундук. Туда, где он лежал до шестьдесят восьмого. Хотел, чтобы линейка сорвалась — и все поняли, что меня не слышат. Собирался вернуть… не успел. Струсил.»'));

    var win = el('div', 'final-win fade-in',
      '<div style="font-size:17px; color:var(--green); letter-spacing:1px;">ДЕЛО ЗАКРЫТО — группа «' + escapeHtml(state.teamName) + '», маршрут ' + state.route + '</div>' +
      '<p style="margin-top:10px; font-size:15px; line-height:1.6;">Директор долго молчит. Потом говорит — не громко: «Реплику вернём. Завтра — первым словом линейки. А звонок ты и понесёшь. Сам. И поставишь на место — перед всей школой».</p>' +
      '<p style="margin-top:8px; font-size:15px; line-height:1.6;">Витя поднимает голову. Впервые за день — не молчит: «А можно… я скажу это слово?»</p>' +
      '<p style="margin-top:8px; font-size:14px; line-height:1.6; color:var(--paper-dim);">А Наталья Викторовна вернулась через час с банкой спирта — и первая услышала всю историю целиком.</p>');
    screenEl.appendChild(win);

    var ch = el('div', 'choices fade-in');
    var rb = el('button', 'btn special', '🔄 Передать дело другой группе');
    rb.addEventListener('click', function () { restart(); });
    ch.appendChild(rb);
    screenEl.appendChild(ch);
  }

  // ==================== ВКЛАДКА «ДОКУМЕНТЫ» ====================
  function renderHints() {
    clearScreen();
    screenEl.appendChild(el('div', 'scene-title fade-in', 'Документы дела'));
    screenEl.appendChild(el('div', 'scene-text fade-in',
      'Здесь только то, что вы уже нашли в своих кабинетах. По каждому найденному предмету можно взять подсказку: первая — намёк, вторая — почти прямой ответ.'));

    screenEl.appendChild(el('div', 'loc-section-title fade-in', 'Стартовый пакет (уже в папке)'));
    var startList = el('div', 'opts fade-in');
    START_DOCS.forEach(function (d) {
      var b = el('button', 'opt', '<span class="radio" style="border-color:var(--paper-dim);"></span>' + escapeHtml(d.name));
      b.addEventListener('click', function () { showDocModal(d.name, d.text); });
      startList.appendChild(b);
    });
    screenEl.appendChild(startList);

    if (state.found.length > 0) {
      screenEl.appendChild(el('div', 'loc-section-title fade-in',
        'Найденные улики (' + state.found.length + '/' + ROUTE_TOTALS[state.route] + ')'));
      var list = el('div', 'opts fade-in');
      var sorted = state.found.slice().sort(function (a, b) { return Number(a) - Number(b); });
      sorted.forEach(function (id) {
        var item = ITEMS[id];
        var b = el('button', 'opt', '<span class="radio" style="border-color:var(--green);background:var(--green);"></span>№' + id + ' — ' + escapeHtml(item.name));
        b.addEventListener('click', function () { showHintModal(id); });
        list.appendChild(b);
      });
      screenEl.appendChild(list);
    } else {
      screenEl.appendChild(el('div', 'scene-text fade-in', 'Выездные улики пока не найдены.'));
    }

    screenEl.appendChild(el('div', 'loc-section-title fade-in', 'У директора'));
    var envList = el('div', 'opts fade-in');
    var envBtn = el('button', 'opt',
      '<span class="radio" style="border-color:' + (state.envelopeOpen ? 'var(--green)' : 'var(--red)') + ';"></span>Конверт с показаниями Тани (сургуч)');
    envBtn.addEventListener('click', function () {
      if (state.envelopeOpen) showDocModal('Показания Тани Крыловой', ENVELOPE_TEXT);
      else alert('Конверт запечатан сургучом. Его вскроют на общем совещании — после того, как сгорят все три версии.');
    });
    envList.appendChild(envBtn);
    screenEl.appendChild(envList);
  }

  // ==================== МОДАЛКИ ====================
  function showDocModal(title, text) {
    var overlay = el('div', 'hint-overlay');
    var panel = el('div', 'hint-panel');

    var x = el('button', 'x', '✕');
    x.addEventListener('click', function () { overlay.remove(); });
    panel.appendChild(x);

    panel.appendChild(el('h3', '', 'Документ дела'));
    panel.appendChild(el('div', 'h-doc', escapeHtml(title)));
    panel.appendChild(el('div', 'h-text', escapeHtml(text)));

    overlay.appendChild(panel);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  function showHintModal(id) {
    var item = ITEMS[id];
    if (!item) return;
    if (!state.hintsUsed[id]) state.hintsUsed[id] = 0;
    var shown = state.hintsUsed[id];

    var overlay = el('div', 'hint-overlay');
    var panel = el('div', 'hint-panel');

    var x = el('button', 'x', '✕');
    x.addEventListener('click', function () { overlay.remove(); });
    panel.appendChild(x);

    panel.appendChild(el('h3', '', 'Подсказка · предмет №' + id));
    panel.appendChild(el('div', 'h-doc', escapeHtml(item.name)));

    for (var i = 0; i < shown; i++) {
      panel.appendChild(el('div', 'h-text', escapeHtml(item.hints[i])));
    }
    if (shown === 0) {
      panel.appendChild(el('div', 'h-text', 'Нажмите «Ещё подсказка», чтобы начать.'));
    }

    panel.appendChild(el('div', 'h-text', '<b>Полный текст улики:</b><br>' + escapeHtml(item.text)));

    var more = el('button', 'more-btn');
    if (shown >= item.hints.length) {
      more.textContent = 'Подсказки закончились';
      more.disabled = true;
    } else {
      more.textContent = 'Ещё подсказка';
      more.addEventListener('click', function () {
        state.hintsUsed[id]++;
        save();
        overlay.remove();
        showHintModal(id);
      });
    }
    panel.appendChild(more);

    overlay.appendChild(panel);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  // ==================== ПАПКА УЛИК ====================
  function toggleBank() {
    var existing = document.getElementById('bankOverlay');
    if (existing) { existing.remove(); return; }

    var overlay = el('div', 'bank-overlay');
    overlay.id = 'bankOverlay';
    var panel = el('div', 'bank-panel');
    panel.appendChild(el('h3', '', 'Папка дела — ' + escapeHtml(state.teamName)));

    START_DOCS.forEach(function (d) {
      panel.appendChild(el('div', 'bank-item start-doc',
        '<span class="tag">Стартовый пакет · ' + escapeHtml(d.cat) + '</span><b>' + escapeHtml(d.name) + '.</b> ' + escapeHtml(d.text)));
    });

    if (state.found.length === 0) {
      panel.appendChild(el('div', '', '<i style="color:#5a4f3d;font-size:14px;">Выездные улики пока не найдены. Ищите предметы со стикерами в своих кабинетах.</i>'));
    } else {
      var sorted = state.found.slice().sort(function (a, b) { return Number(a) - Number(b); });
      sorted.forEach(function (id) {
        var it = ITEMS[id];
        panel.appendChild(el('div', 'bank-item',
          '<span class="tag">Предмет №' + id + ' · ' + escapeHtml(it.place) + '</span><b>' + escapeHtml(it.name) + '.</b> ' + escapeHtml(it.text)));
      });
    }

    if (state.localVersionDone) {
      panel.appendChild(el('div', 'bank-item',
        '<span class="tag">Версия вашей группы</span><b>Подозреваемый:</b> ' + escapeHtml(ROUTES[state.route].suspect)));
    }

    if (state.envelopeOpen) {
      panel.appendChild(el('div', 'bank-item',
        '<span class="tag">Конверт директора</span><b>Показания Тани Крыловой.</b> ' + escapeHtml(ENVELOPE_TEXT)));
    }

    var close = el('button', 'bank-close', 'Закрыть папку');
    close.addEventListener('click', function () { overlay.remove(); });
    panel.appendChild(close);

    overlay.appendChild(panel);
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
    });
    document.body.appendChild(overlay);
  }

  // ==================== ПЕРЕКЛЮЧЕНИЕ ====================
  function setActiveTab(active) {
    [tabField, tabQ, tabH].forEach(function (t) { t.classList.remove('active'); });
    active.classList.add('active');
  }

  function render() {
    if (!state.teamName || !state.route) { renderStart(); return; }
    if (state.tab === 'field') renderField();
    else if (state.tab === 'q') renderQuestions();
    else renderHints();
  }

  tabField.addEventListener('click', function () {
    state.tab = 'field'; setActiveTab(tabField); save(); render();
  });

  tabQ.addEventListener('click', function () {
    state.tab = 'q'; setActiveTab(tabQ); save(); render();
  });

  tabH.addEventListener('click', function () {
    state.tab = 'h'; setActiveTab(tabH); save(); render();
  });

  bankBtn.addEventListener('click', toggleBank);

  function restart() {
    state.teamName = '';
    state.route = '';
    state.found = [];
    state.solved = [];
    state.qView = null;
    state.localVersionDone = false;
    state.meetingDone = false;
    state.finalStep = 0;
    state.envelopeOpen = false;
    state.hintsUsed = {};
    state.clock = 19 * 60 + 40;
    state.tab = 'field';
    teamEl.textContent = '';
    clockEl.textContent = '19:40';
    updateBankBtn();
    save();
    renderStart();
  }

  // ==================== ЗАПУСК ====================
  if (load() && state.route) {
    teamEl.textContent = state.teamName + ' · Маршрут ' + state.route;
    tabsEl.style.display = 'flex';
    bankBtn.style.display = 'inline-block';
    updateBankBtn();
    var h = Math.floor(state.clock / 60), m = state.clock % 60;
    clockEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    render();
  } else {
    renderStart();
  }

})();
</script>

</body>
</html>
